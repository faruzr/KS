<!doctype html>
<html lang="th">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>กรงสีลาดพร้าว — ส่งสต็อก</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue-900:#0f2d5e;--blue-700:#1a4a9c;--blue-400:#3b82f6;--blue-100:#dbeafe;--blue-50:#eff6ff;--gray-50:#f8fafc;--gray-200:#e2e8f0;--gray-600:#475569;--gray-800:#1e293b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eaf0f7;color:var(--gray-800);font:15px/1.65 'Sarabun',sans-serif}
main{max-width:480px;min-height:100dvh;margin:auto;padding:0 16px 64px;background:var(--gray-50)}
.page-header{margin:0 -16px 18px;padding:24px 20px 22px;background:var(--blue-900);color:white;border-radius:0 0 24px 24px}
.page-header small{color:var(--blue-100);font-size:12px}
h1{font-size:23px;line-height:1.45;font-weight:700;margin:6px 0 0}
p{margin:12px 0;color:var(--gray-600)}
.notice{background:#fef9e7;padding:11px 13px;border:1px solid #f5e6b3;border-radius:11px;color:#8a5a12;font-size:12px;line-height:1.7}
label{display:block;margin:14px 0;font-size:14px;font-weight:600}
input,textarea,button{font:inherit;border-radius:11px;padding:11px 12px;border:1.5px solid var(--gray-200)}
input,textarea{display:block;width:100%;margin-top:6px;background:white;color:var(--gray-800);font-size:16px;font-weight:400}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--blue-400);outline-offset:2px;border-color:var(--blue-400)}
button:focus-visible{outline:3px solid var(--blue-400);outline-offset:3px}
fieldset{border:0;padding:0;margin:22px 0}
legend{font-size:15px;font-weight:700;color:var(--blue-700);padding:0 4px 10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:white;border:1.5px solid #edf1f6;border-radius:12px;padding:11px 12px;margin:0 0 7px;font-size:14px;font-weight:500;line-height:1.45}
.item:focus-within{background:var(--blue-50);border-color:var(--blue-400)}
.item input{margin:0;text-align:center;background:var(--gray-50);font-weight:600;min-height:44px;padding:8px 5px;border-radius:9px}
.unit-inputs{display:flex;gap:6px;align-items:flex-end}
.unit-field{display:flex;flex-direction:column;align-items:center;gap:4px;width:58px;margin:0}
.item .item-note{grid-column:1/-1;min-height:0;text-align:left;font-weight:400;font-size:16px;padding:8px 10px;background:white}
.unit{display:block;font-size:11px;font-weight:500;color:var(--gray-600);text-align:center}
button{background:linear-gradient(135deg,#16a34a,#15803d);color:white;width:100%;cursor:pointer;border:0;border-radius:13px;padding:14px;font-weight:700;box-shadow:0 4px 12px #16a34a26}
button:disabled{background:#94a3b8;box-shadow:none;cursor:default}
#status{white-space:pre-wrap;padding:13px;background:var(--blue-50);color:var(--blue-700);border-radius:12px;font-size:13px}
.category-nav{position:sticky;top:0;z-index:2;background:var(--gray-50);padding-top:6px}
.category-tabs{display:flex;gap:4px;overflow-x:auto;background:var(--blue-900);padding:8px;border-radius:12px 12px 0 0}
.category-tabs button{width:auto;flex-shrink:0;padding:7px 13px;border-radius:20px;background:none;color:#dbeafe;box-shadow:none;font-size:13px;font-weight:500;min-height:40px}
.category-tabs button[aria-pressed="true"]{background:white;color:var(--blue-900);font-weight:700}
#progress{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:0 0 12px 12px;padding:9px 12px;font-size:12px;font-weight:600;color:var(--blue-700)}
.page-controls{display:flex;align-items:center;gap:10px;margin:16px 0}
.page-controls button{width:auto;flex:1;background:var(--blue-50);color:var(--blue-700);box-shadow:none;padding:10px;font-size:14px}
.page-controls button:disabled{color:#94a3b8;background:#f1f5f9}
.page-controls span{white-space:nowrap;font-size:12px;color:var(--gray-600)}
[hidden]{display:none!important}
small{color:var(--gray-600);font-size:12px;font-weight:400}
@media(min-width:540px){main{margin:24px auto;border-radius:24px;box-shadow:0 12px 40px #0f2d5e0d}.page-header{border-radius:24px 24px 20px 20px}}
</style>
<main>
<header class="page-header"><small>กรงสี Assistant · ลาดพร้าว 122</small><h1>รายงานสต็อกคงเหลือ</h1></header>
<p class="notice">เมื่อยืนยัน ระบบจะส่งรายงานเข้ากลุ่ม “ลาดพร้าว 122 Operation” ทันที</p>
<p>กรอกทุกช่อง ของหมดใส่ <strong>0</strong> หน้านี้ไม่ส่งใบสั่งของ</p>
<form id="report" novalidate>
<label>ชื่อผู้ตรวจ<input id="inspector" required maxlength="100" autocomplete="name"></label>
<div class="category-nav" id="category-nav"><nav class="category-tabs" id="category-tabs" aria-label="หมวดสินค้า"></nav><div id="progress" aria-live="polite"></div></div><div id="items"></div>
<div class="page-controls"><button type="button" id="previous">ก่อนหน้า</button><span id="page-number"></span><button type="button" id="next">ถัดไป</button></div>
<button id="send">ยืนยันส่งรายงานสต็อก</button>
</form><p id="status" role="status">กรอกครบ → ส่งรูปใบสต็อกเข้ากลุ่ม LINE</p>
</main>
<script type="module">
import { REPORT_BRANCH, REPORT_SLOTS, validateReport, reportReceipt } from './lib/ladprao-report.js';
const $ = id => document.getElementById(id);
let lockedPayload = null;
let firstAttemptAt = 0;
let fields = null;
const categories = [...new Set(REPORT_SLOTS.map(s => s.category))];
let activeCategory = 0;
const panels = [];
const categoryButtons = [];
for (const [categoryIndex, category] of categories.entries()) {
  const section = document.createElement('fieldset');
  section.id = 'category-' + categoryIndex;
  panels.push(section);
  const tab = document.createElement('button'); tab.type = 'button'; tab.textContent = category;
  tab.setAttribute('aria-controls', section.id);
  tab.addEventListener('click', () => showCategory(categoryIndex));
  categoryButtons.push(tab); $('category-tabs').append(tab);
  const legend = document.createElement('legend'); legend.textContent = category; section.append(legend);
  const productRows = new Map();
  REPORT_SLOTS.forEach((slot, index) => {
    if (slot.category !== category) return;
    if (!productRows.has(slot.name)) {
      const row = document.createElement('div'); row.className = 'item';
      const title = document.createElement('span'); title.textContent = slot.label;
      const units = document.createElement('div'); units.className = 'unit-inputs';
      row.append(title, units); section.append(row);
      productRows.set(slot.name, units);
    }
    const label = document.createElement('label'); label.className = 'unit-field';
    const unit = document.createElement('span'); unit.className = 'unit'; unit.textContent = slot.unit;
    const input = document.createElement('input'); input.type = 'number'; input.min = '0'; input.step = 'any'; input.required = true; input.inputMode = 'decimal'; input.dataset.slot = index; input.setAttribute('aria-label', slot.label + ' ' + slot.unit);
    label.append(unit, input); productRows.get(slot.name).append(label);
    const note = document.createElement('input'); note.type = 'text'; note.maxLength = 50; note.className = 'item-note'; note.placeholder = 'หมายเหตุ (ถ้ามี) เช่น 4 กระป๋อง'; note.dataset.note = index; note.setAttribute('aria-label', 'หมายเหตุ ' + slot.label);
    productRows.get(slot.name).parentElement.append(note);
  });
  $('items').append(section);
}
fields = [...document.querySelectorAll('[data-slot]')];
const noteFields = [...document.querySelectorAll('[data-note]')];
function progress() {
  const filled = list => list.filter(f => f.value !== '' && f.validity.valid).length;
  const currentFields = [...panels[activeCategory].querySelectorAll('[data-slot]')];
  $('progress').textContent = `หมวดนี้ ${filled(currentFields)}/${currentFields.length} ช่อง · ทั้งหมด ${filled(fields)}/${REPORT_SLOTS.length} ช่อง`;
}
function showCategory(index, scroll = true) {
  activeCategory = Math.max(0, Math.min(categories.length - 1, index));
  panels.forEach((panel, i) => { panel.hidden = i !== activeCategory; });
  categoryButtons.forEach((tab, i) => tab.setAttribute('aria-pressed', String(i === activeCategory)));
  $('previous').disabled = activeCategory === 0;
  $('next').disabled = activeCategory === categories.length - 1;
  $('page-number').textContent = `หมวด ${activeCategory + 1} / ${categories.length}`;
  progress();
  if (scroll) $('category-nav').scrollIntoView({block:'start'});
}
$('previous').addEventListener('click', () => showCategory(activeCategory - 1));
$('next').addEventListener('click', () => showCategory(activeCategory + 1));
$('report').addEventListener('input', progress); showCategory(0, false);
$('report').addEventListener('submit', async event => {
  event.preventDefault(); if ($('send').disabled) return;
  if (lockedPayload && Date.now() - firstAttemptAt > 23 * 60 * 60 * 1000) {
    $('status').textContent = 'รายงานนี้ค้างเกิน 23 ชั่วโมง หยุดส่งซ้ำ กรุณาตรวจรายงานในกลุ่มกับผู้ดูแลก่อน';
    return;
  }
  const invalid = [...$('report').querySelectorAll('input,textarea')].find(field => !field.disabled && !field.validity.valid);
  if (invalid) {
    if (invalid.dataset.slot !== undefined) showCategory(categories.indexOf(REPORT_SLOTS[Number(invalid.dataset.slot)].category));
    invalid.focus(); invalid.reportValidity();
    $('status').textContent = 'กรุณากรอกข้อมูลให้ครบ ของหมดให้ใส่ 0';
    return;
  }
  try {
    if (!lockedPayload) lockedPayload = validateReport({ requestId: crypto.randomUUID(), branch: REPORT_BRANCH, submittedBy: $('inspector').value, note: '', items: fields.map(f => ({name: REPORT_SLOTS[Number(f.dataset.slot)].name, unit: REPORT_SLOTS[Number(f.dataset.slot)].unit, qty_remaining: f.value === '' ? null : Number(f.value), note: noteFields[Number(f.dataset.slot)].value})) });
  } catch (error) { $('status').textContent = error.message; return; }
  if (!lockedPayload.submittedAt) { firstAttemptAt = Date.now(); lockedPayload.submittedAt = new Date(firstAttemptAt).toISOString(); }
  $('send').disabled = true;
  for (const field of [...fields, ...noteFields, $('inspector')]) field.disabled = true;
  $('status').textContent = 'กำลังตรวจผลรายงาน… รหัส ' + lockedPayload.requestId;
  try {
    const response = await fetch('/api/ladprao-stock', {method:'POST', headers:{'Content-Type':'application/json'},body:JSON.stringify(lockedPayload),signal:AbortSignal.timeout(60000)});
    const result = await response.json();
    if (!response.ok) {
      if ([400,405,503].includes(response.status)) { lockedPayload = null; for (const field of [...fields, ...noteFields, $('inspector')]) field.disabled = false; }
      throw new Error(result.message || 'ยังยืนยันผลไม่ได้');
    }
    const receipt = reportReceipt(result, lockedPayload.requestId);
    $('status').textContent = `LINE รับรายงานเพื่อส่งเข้ากลุ่มแล้ว\nรหัสรายงาน ${receipt.requestId}\nรูปใบสต็อกจะขึ้นในกลุ่ม และเก็บไว้ในโฟลเดอร์ KS stock`;
    $('send').textContent = 'LINE รับรายงานนี้แล้ว';
  } catch (error) {
    $('status').textContent = error.message + (lockedPayload ? '\nเก็บหน้านี้ไว้ และกดตรวจผลอีกครั้งด้วยรายงานเดิม' : '');
    $('send').disabled = false; $('send').textContent = lockedPayload ? 'ตรวจผล / ลองส่งรายงานเดิม' : 'ยืนยันส่งรายงานสต็อก';
  }
});
window.addEventListener('beforeunload', event => { if (lockedPayload) { event.preventDefault(); event.returnValue = ''; } });
</script>
</html>
